server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ieps

  # 数据源配置 (Druid)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ieps?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 020701cx
    druid:
      # 初始化大小
      initial-size: 5
      # 最小连接数
      min-idle: 5
      # 最大连接数
      max-active: 20
      # 获取连接等待超时时间(毫秒)
      max-wait: 60000
      # 检测连接是否有效的 SQL
      validation-query: SELECT 1
      # 申请连接时检测
      test-on-borrow: false
      # 归还连接时检测
      test-on-return: false
      # 建议配置为 true，不影响性能，并且保证安全性
      test-while-idle: true
      # 配置间隔多久才进行一次检测(毫秒)
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间(毫秒)
      min-evictable-idle-time-millis: 300000
      # StatViewServlet 监控配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
      # WebStatFilter 配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  # 静态资源配置
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/
        - file:./upload/

  # 缓存配置
  cache:
    type: ehcache
    ehcache:
      config: classpath:ehcache/ehcache.xml

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.ieps.pojo,com.ieps.dto
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 日志配置
logging:
  level:
    com.ieps: DEBUG
    org.springframework: INFO
    com.alibaba.druid: INFO
