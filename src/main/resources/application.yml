server:
  address: ${IEPS_SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ieps

  redis:
    host: 127.0.0.1
    port: 6379
    database: 1
    timeout: 3s

  # 数据源配置 (HikariCP)
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ieps?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 020701cx
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 1800000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      pool-name: IepsHikariCP

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0B

  # 静态资源配置
  mvc:
    static-path-pattern: /**
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/

  # 缓存配置
  cache:
    type: ehcache
    ehcache:
      config: classpath:ehcache/ehcache.xml

  # 邮件配置
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

ieps:
  redis:
    verify-code:
      ttl-seconds: 300
      cooldown-seconds: 60
      max-failures: 5
      namespace: ieps:verify

  # JWT 配置
  jwt:
    secret: Ieps_JWT_Secret_Key_2024_For_Innovation_Project
    expiration: 1800000

  storage:
    cos:
      secret-id: ${COS_SECRET_ID:${IEPS_COS_SECRET_ID:}}
      secret-key: ${COS_SECRET_KEY:${IEPS_COS_SECRET_KEY:}}
      bucket: ${COS_BUCKET:${IEPS_COS_BUCKET:}}
      region: ${COS_REGION:${IEPS_COS_REGION:}}
      app-id: ${COS_APP_ID:${IEPS_COS_APP_ID:}}
      sts-duration-seconds: ${COS_STS_DURATION_SECONDS:${IEPS_COS_STS_DURATION_SECONDS:600}}
      download-url-ttl-seconds: ${COS_DOWNLOAD_URL_TTL_SECONDS:${IEPS_COS_DOWNLOAD_URL_TTL_SECONDS:300}}
      migration-enabled: ${COS_MIGRATION_ENABLED:${IEPS_COS_MIGRATION_ENABLED:false}}
      multipart-upload-threshold: 16MB
      minimum-upload-part-size: 8MB
      transfer-thread-pool-size: 4
      download-task-executor-pool-size: 2
      download-task-expire-seconds: 86400
      download-task-history-retention-seconds: 604800
      download-task-cleanup-interval-ms: 3600000

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.ieps.pojo,com.ieps.dto
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 日志配置
logging:
  level:
    com.ieps: DEBUG
    org.springframework: INFO
    com.zaxxer.hikari: INFO
