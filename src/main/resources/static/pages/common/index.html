<!-- 图片和姓名自动更改 -->
<script>
    (function () {
        const now = new Date();
        const dayNames = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        const parts = [
            now.getFullYear() + "年" + String(now.getMonth() + 1) + "月" + String(now.getDate()) + "日",
            dayNames[now.getDay()]
        ]; // 前面加个0感觉不太好看
        const topStatusText = document.getElementById("topStatusText");
        if (topStatusText) {
            topStatusText.textContent = "欢迎使用 IEPS 管理平台 · " + parts.join(" ");
        }
    }());

    ieps.auth.requireAuth();

    var currentUser = ieps.auth.currentUser();
    var userNumAdmin = currentUser.userNum || "";
    var roleIdAdmin = currentUser.roleId != null ? String(currentUser.roleId) : "";
    var param = ieps.auth.params();

    var userImg = "/static/images/default.jpg";
    var userName = "";
    var dataJson;

    function resolveUserImg(userImgPath) {
        if (!userImgPath) {
            return "/static/images/default.jpg";
        }
        if (/^(https?:)?\/\//.test(userImgPath) || userImgPath.indexOf("/") === 0) {
            return userImgPath;
        }
        return "/" + userImgPath.replace(/^\/+/, "");
    }

    function getMenu() {
        var result = ieps.http.postSync("/getMenu", {}, {silentError: true});
        if (!result || result.status !== 0) {
            if (window.layer) {
                layer.msg(result && result.msg ? result.msg : "菜单加载失败，请稍后重试！", {icon: 2});
            }
            return [];
        }
        dataJson = result.data || [];
        return dataJson;
    }

    function getUserImg() {
        return userImg;
    }

    function getUserName() {
        return userName;
    }
</script>

<script>
    $(function () {
        ieps.auth.loadCurrentUserInfo({silentError: true}).done(function (result) {
            if (!result || result.status != 0) {
                return layer.msg(result && result.msg ? result.msg : "加载当前用户信息失败！", {icon: 2});
            }
            result = result.data;

            userImg = resolveUserImg(result.userImg);
            userName = result.userName || "";

            $(".custom-img").attr("src", userImg);
            $(".userName").text(userName);
        });
    });
</script>

<!-- 更换头像 -->
<script>
    layui.use('upload', function () {
        const upload = layui.upload;

        upload.render({
            elem: '.custom-img',
            url: '/changeUserImg',
            accept: 'images',
            choose: function (obj) {
                obj.preview(function (index, file, result) {
                    $('.custom-img').attr('src', result);
                });
            },
            done: function (result) {
                if (!result || result.status != 0) {
                    return layer.msg(result && result.msg ? result.msg : "头像上传失败，请稍后重试！", {icon: 2});
                }
                layer.msg(result.msg || "头像上传成功！", {icon: 1});
            },
            error: function () {
                layer.msg("头像上传失败，请稍后重试！", {icon: 2});
            }
        });
    });
</script>

<script>

    layui.use(['bodyTab', 'form', 'element', 'layer'], function () {
        const form = layui.form;
        const layer = layui.layer;
        const element = layui.element;

        //锁屏
        function lockPage() {
            layer.open({
                title: false,
                type: 1,
                content: '	<div class="admin-header-lock" id="lock-box">' +
                '<div class="admin-header-lock-img"><img src="' + userImg + '"/></div>' +
                '<div class="admin-header-lock-name" id="lockUserName">' + userName + '</div>' +
                '<div class="input_btn">' +
                '<input type="password" class="admin-header-lock-input layui-input" autocomplete="off" placeholder="请输入密码解锁.." name="lockPwd" id="lockPwd" />' +
                '<button class="layui-btn" id="unlock">解锁</button>' +
                '</div>' +
                '<p>请输入账号密码，否则不会解锁成功哦！！！</p>' +
                '</div>',
                closeBtn: 0,
                shade: 0.9
            });
            $(".admin-header-lock-input").focus();
        }

        $(".lockcms").on("click", function () {
            window.sessionStorage.setItem("lockcms", true);
            lockPage();
        });

        // 判断是否显示锁屏
        if (window.sessionStorage.getItem("lockcms") == "true") {
            lockPage();
        }
        // 解锁
        $("body").on("click", "#unlock", function () {
            const currentBtn = $(this);
            const currentInput = currentBtn.siblings(".admin-header-lock-input");
            if (currentInput.val() == '') {
                layer.msg("请输入解锁密码！");
                currentInput.focus();
            } else {
                $.post("/checkUserPwdWithUserNum", {
                    userPwd: currentInput.val()
                }, function (result) {
                    if (result.status !== 0) {
                        layer.msg(result.msg || "密码错误，请重新输入！");
                        currentInput.val('').focus();
                        return;
                    }
                    window.sessionStorage.setItem("lockcms", false);
                    currentInput.val('');
                    layer.closeAll("page");
                });
            }
        });
        $(document).on('keydown', function () {
            if (event.keyCode == 13) {
                $("#unlock").click();
            }
        });

    });

</script>
