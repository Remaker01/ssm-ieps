<!DOCTYPE html>
<html>
<head>
    <title>修改密码</title>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/layui@2.7/dist/css/layui.css"/>
    <style>
        .password {
            width: 40%;
        }
        @media screen and (max-width: 1250px){
            .password {
                width: 50%;
            }
        }
        @media screen and (max-width: 1000px){
            .password {
                width: 60%;
            }
        }
        @media screen and (max-width: 750px){
            .password {
                width: 70%;
            }
        }
        @media screen and (max-width: 500px){
            .password {
                width: 80%;
            }
        }
    </style>
</head>

<body>
<form class="layui-form" action="" style="margin-top: 30px; ">
    <div class="layui-form-item password">
        <label class="layui-form-label">原始密码</label>
        <div class="layui-input-block">
            <input type="password" name="oldPassword" required lay-verify="required" placeholder="请输入原始密码"
                   autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item password">
        <label class="layui-form-label">新密码</label>
        <div class="layui-input-block">
            <input type="password" name="newPassword" required lay-verify="required" placeholder="请输入新密码"
                   autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item password">
        <label class="layui-form-label">确认新密码</label>
        <div class="layui-input-block">
            <input type="password" name="reNewPassword" required lay-verify="required" placeholder="请再次输入新密码"
                   autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <input type="button" class="layui-btn layui-btn-normal layui-btn-disabled" name="reUpdate" value="确认修改"/>
        </div>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/layui@2.7/dist/layui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="../../static/js/ieps-jwt.js"></script>
<script src="../../static/js/ieps-app.js"></script>
<!-- 获取url参数 -->
<script src="../../static/js/getParam.js"></script>

<!-- 加密和解密 -->
<script src="../../static/js/module/encrypt/aes.js"></script>
<script src="../../static/js/module/encrypt/customAesEncrypt.js"></script>

<script>
    layui.use(['form', 'layer'], function () {
        const form = layui.form;
        const layer = layui.layer;
    });
</script>

<script>
    ieps.auth.requireAuth();

    let oldPassword = $("input[name='oldPassword']");
    let newPassword = $("input[name='newPassword']");
    let reNewPassword = $("input[name='reNewPassword']");
    let reUpdate = $("input[name='reUpdate']");

    $(function () {
        oldPassword = $("input[name='oldPassword']");
        newPassword = $("input[name='newPassword']");
        reNewPassword = $("input[name='reNewPassword']");
        reUpdate = $("input[name='reUpdate']");

        $('input:lt(3)').css("background-color", "red").attr("autocomplete", "off");;
    });

</script>

<script>
    newPassword.focus(function () {
        checkUserPwdWithUserNum();
    });

    reNewPassword.focus(function () {
        $(this).on("mouseleave", function () {
            $(this).off("mouseleave");
            if (newPassword.val() === "" || oldPassword.val() === "") {
                return;
            }
            // if (reNewPassword.val() != "") {
            //     if (oldPassword.val() == "") {
            //         $("input:lt(3)").val('');
            //         return layer.msg("请先输入原始密码！");
            //     }
            //
            //     if (newPassword.val() == "") {
            //         $("input[name='reNewPassword']").val('');
            //         return layer.msg("请先输入新密码！");
            //     }
            // }
            // if (newPassword.val() != reNewPassword.val()) {
            //     $("input:gt(0)").val('');
            //     return layer.msg('前后两次密码不一致，请重新输入！');
            // }
            if (newPassword.val() == reNewPassword.val()) {
                const passwordPolicyMessage = validatePasswordPolicy(newPassword.val());
                if (passwordPolicyMessage) {
                    layer.msg(passwordPolicyMessage);
                    newPassword.val('');
                    reNewPassword.val('');
                    return;
                }
                reUpdate.removeClass("layui-btn-disabled").on("click", reUpdatePwd);
            }
        });
    });
</script>

<script>
    function checkUserPwdWithUserNum() {
        if ($("input[name='oldPassword']").val() === "" || $("input[name='oldPassword']").val() == null) {
            return layer.msg("原始密码不能为空！", {icon: 2});
        }

        const param = {
            userPwd: $("input[name='oldPassword']").val()
        };

        $.post("/checkUserPwdWithUserNum", param, function (result) {
            if (result.status !== 0) {
                $("input[name='oldPassword']").val("");
                return layer.msg(result.msg, {icon: 2});
            }

            layer.msg(result.msg, {icon: 1});
        })

    }

    function reUpdatePwd() {
        const passwordPolicyMessage = validatePasswordPolicy(newPassword.val());
        if (passwordPolicyMessage) {
            return layer.msg(passwordPolicyMessage, {icon: 2});
        }

        const param = {
            userPwd: oldPassword.val(),
            newPassword: newPassword.val(),
            rePassword: reNewPassword.val()
        };

        $.post("/modifyPwd", param, function (result) {
            if (result.status !== 0) {
                return layer.msg(result.msg, {icon: 2});
            }
            layer.msg(result.msg, {icon: 1});

            reUpdate.addClass("layui-btn-disabled").off("click", reUpdatePwd);
//            "window.location.href"、"location.href"是本页面跳转
//            "parent.location.href"是上一层页面跳转
//            "top.location.href"是最外层的页面跳转

            window.sessionStorage.removeItem("menu");
            menu = [];
            window.sessionStorage.removeItem("curmenu");

            setTimeout(function () {
                $(parent).attr('location', '/');
            }, 1000);
        })
    }

    function validatePasswordPolicy(password) {
        if (/\s/.test(password) || password.length < 8 || password.length > 30) {
            return "密码需为8-30位，且至少包含数字、大写字母、小写字母、特殊符号中的2类，且不能包含空格！";
        }
        let categoryCount = 0;
        if (/[0-9]/.test(password)) {
            categoryCount++;
        }
        if (/[A-Z]/.test(password)) {
            categoryCount++;
        }
        if (/[a-z]/.test(password)) {
            categoryCount++;
        }
        if (/[^A-Za-z0-9]/.test(password)) {
            categoryCount++;
        }
        return categoryCount >= 2 ? null : "密码需为8-30位，且至少包含数字、大写字母、小写字母、特殊符号中的2类，且不能包含空格！";
    }
</script>

</body>
</html>
